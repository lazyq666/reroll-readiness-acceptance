name: Isolated readiness diagnostic
on:
  push:
    branches: [codex/readiness-diagnostic]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.10.0
      - run: uv pip sync --system --require-hashes requirements.lock.txt
      - run: python scripts/readiness_diagnostic.py
